{% extends "base.html" %}

{% block title %}상품 목록 - {{ site_name }} {% endblock title %}

{% block content %}
<div class="row">
    <h1>상품 목록</h1>

    {% for product in products %}
    <div class="col-md-3 mb-4">
        <div class="card">
            <img src="{{ product.image }}" class="card-img-top">
            <div class="card-body">
                <h5>{{ product.name }}</h5>
                <p>{{ product.price | format_price }}원</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock content %}

{% block scripts %}
<script>
    // 이 페이지에서만 사용하는 스크립트

</script>
{% endblock scripts %}
