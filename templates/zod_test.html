<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanilla JS + Zod (실시간 검증)</title>

  <!-- 핵심: 브라우저에게 "zod" 패키지의 실제 로컬 경로를 알려줍니다 -->
  <script type="importmap">
    {
      "imports": { "zod": "../static/zod/index.js" }
    }
  </script>

  <link rel="stylesheet" href="../static/css/zod_style.css">

</head>
<body>
  <div class="form-container">
    <h2>회원가입</h2>
    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="username">사용자 이름</label>
        <input type="text" id="username" name="username">
        <div class="error-message" id="usernameError"></div>
      </div>
      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email">
        <div class="error-message" id="emailError"></div>
      </div>
      <div class="form-group">
        <label for="phoneNumber">전화번호</label>
        <input type="text" id="phoneNumber" name="phoneNumber" placeholder="010-1234-5678">
        <div class="error-message" id="phoneNumberError"></div>
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password">
        <div class="error-message" id="passwordError"></div>
      </div>
      <div class="form-group">
        <label for="passwordConfirm">비밀번호 확인</label>
        <input type="password" id="passwordConfirm" name="passwordConfirm">
        <div class="error-message" id="passwordConfirmError"></div>
      </div>
      <button type="submit">가입하기</button>
    </form>
  </div>

  <script type="module">
    import { z } from 'zod';

    // 💡 비밀번호 복잡도 검증을 위한 정규식 정의
    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

    const registerSchema = z.object({
      username: z.string().min(3, { message: "사용자 이름은 최소 3자 이상이어야 합니다." }),
      email: z.string().email({ message: "올바른 이메일 주소를 입력해주세요." }),
      phoneNumber: z.string().regex(/^01[0-9]-\d{3,4}-\d{4}$/, { message: "올바른 전화번호 형식이어야 합니다." }),
      
      // 💡 .regex() 메서드를 추가하여 4가지 조건을 모두 검사합니다.
      password: z.string()
        .min(8, { message: "비밀번호는 최소 8자 이상이어야 합니다." })
        .regex(passwordRegex, { 
          message: "비밀번호는 영문 대문자, 소문자, 숫자, 특수문자(@$!%*?&)를 각각 최소 1개 이상 포함해야 합니다." 
        }),
      passwordConfirm: z.string()
    }).refine((data) => data.password === data.passwordConfirm, {
      message: "비밀번호가 일치하지 않습니다.",
      path: ["passwordConfirm"],
    });

    const form = document.getElementById('registerForm');
    const fields = ['username', 'email', 'phoneNumber', 'password', 'passwordConfirm'];

    // 전체 폼 상태를 기반으로 실시간으로 단일 필드를 검증하는 함수
    function validateField(fieldName) {
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      
      const result = registerSchema.safeParse(data);
      
      if (!result.success) {
        const errorFormatted = result.error.flatten().fieldErrors;
        
        if (errorFormatted[fieldName]) {
          showFieldError(fieldName, errorFormatted[fieldName]);
        } else {
          clearFieldError(fieldName);
        }

        if (fieldName === 'password' || fieldName === 'passwordConfirm') {
          if (errorFormatted['passwordConfirm']) {
            showFieldError('passwordConfirm', errorFormatted['passwordConfirm']);
          } else {
            clearFieldError('passwordConfirm');
          }
        }
      } else {
        clearFieldError(fieldName);
        if (fieldName === 'password') clearFieldError('passwordConfirm');
      }
    }

    // 실시간 검증을 위한 이벤트 리스너 등록
    fields.forEach((field) => {
      const inputElement = document.getElementById(field);
      if (inputElement) {
        inputElement.addEventListener('input', () => {
          validateField(field);
        });
      }
    });

    // 폼 제출 이벤트
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      clearErrors();

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      const result = registerSchema.safeParse(data);

      if (!result.success) {
        displayErrors(result.error);
      } else {
        alert('🎉 회원가입 성공!');
        form.reset();
      }
    });

    // 전체 에러 표시 함수
    function displayErrors(zodError) {
      const errorFormatted = zodError.flatten().fieldErrors;
      Object.keys(errorFormatted).forEach((field) => {
        showFieldError(field, errorFormatted[field]);
      });
    }

    // 단일 필드 에러 표시 헬퍼 함수
    function showFieldError(field, message) {
      const errorDiv = document.getElementById(`${field}Error`);
      const inputField = document.getElementById(field);
      if (errorDiv && inputField) {
        errorDiv.textContent = message[0]; // 배열의 첫 번째 에러 메시지만 출력
        inputField.classList.add('error-input');
      }
    }

    // 단일 필드 에러 제거 헬퍼 함수
    function clearFieldError(field) {
      const errorDiv = document.getElementById(`${field}Error`);
      const inputField = document.getElementById(field);
      if (errorDiv && inputField) {
        errorDiv.textContent = '';
        inputField.classList.remove('error-input');
      }
    }

    // 전체 에러 초기화 함수
    function clearErrors() {
      fields.forEach((field) => {
        clearFieldError(field);
      });
    }
  </script>

</body>
</html>
